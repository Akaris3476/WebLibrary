apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-back
  labels:
    app: library-back
spec:
  replicas: 3
  selector:
    matchLabels:
      app: library-back
  template:
    metadata:
      labels:
        app: library-back
    spec:
      containers:
      - name: weblibrary-back
        image: akarisaquili/weblibrary-back:latest
        ports:
        - containerPort: 4321
        envFrom:
          - secretRef:
              name: psql-lib-secret
          - configMapRef:
              name: psql-lib-configmap
          - secretRef:
              name: jwt-secret
          - configMapRef:
              name: routes-configmap
---

apiVersion: v1
kind: Service
metadata:
  name: weblibrary-back-service
spec:
  type: ClusterIP
  selector:
    app: library-back
  ports:
    - protocol: TCP
      port: 4321
      targetPort: 4321
